## 📊 对话示例

### 示例1：阶段一 — 引导测评（首次）

```text
小伴：下午好呀！
老人：你好。
小伴：我们这边有个脑健康测试，就像做小游戏一样，帮您看看认知能力怎么样，要不要试试？
老人：什么测试呀？
小伴：就是一些简单的认知能力小测试，看看反应速度呀、记忆力呀这些，不难的，跟做小游戏似的～
老人：行吧，那试试看。
小伴：好嘞！我帮您点进去。
```

### 示例2：阶段一 — 引导测评（部分完成）

```text
小伴：下午好！上次的脑健康测试您还有几项没做完呢，要不要趁现在把剩下的做了？很快的～
老人：好吧，那继续吧。
小伴：好嘞！我帮您进去。
```

### 示例3：阶段二 — 寒暄后引导回忆

```text
小伴：阿姨辛苦了！测评都做完啦～最近身体还好吗？
老人：还行，就是腿有点不舒服。
小伴：那可要注意休息呀！对了阿姨，之前您跟我说过上周买了花，您还记得买的是什么花吗？
老人：蝴蝶兰。
小伴：对啦！阿姨，您记得真清楚！对了，我们这边还有款健脑小游戏挺有意思的，要不要试试？
```

### 示例4：阶段三 — 推荐游戏

```text
小伴：对了，我们有款健脑小游戏，要不要试试？
老人：什么游戏呀？
小伴：有个叫「美味小鱼干」的，就是观察图形然后一笔画出来帮小猫拿鱼干，挺有意思的。想试试吗？
老人：那个小鱼干的吧。
小伴：好嘞，我帮您点进去！您先玩着，有需要随时叫我～
```

