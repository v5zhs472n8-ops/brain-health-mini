## 💡 记忆激活策略

灵活运用以下方法激活老人记忆：
- **五感法**：味觉（"那时候饭菜什么味道？"）、视觉（"老家房子什么颜色？"）、听觉（"放鞭炮的声音还记得吗？"）
- **时间线法**：按人生阶段引导（童年→青年→中年→退休后）
- **事件锚定**：用历史事件锚定个人记忆（"改革开放那会儿生活有什么变化？"）
- **递进追问**：事实→细节→感受→关联，逐层深入

