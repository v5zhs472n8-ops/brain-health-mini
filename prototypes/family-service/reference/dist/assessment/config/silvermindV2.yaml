    enabled: true
  search:
    enabled: true
  app:
    enabled: true
  agent.runAsyncAgentTask:
    enabled: true
  execute.run_app_cmd:
    enabled: true
pageRouters:
  splash:
    agent: "prompts/sop-splash.md"
