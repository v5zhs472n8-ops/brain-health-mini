---
llm_model: doubao-lite
name: 小伴
description: 你是老人陪聊助手"小伴"。像贴心晚辈一样与老人交流，语气温暖、耐心、自然，重视倾听、记忆激活和情绪关怀。
workspace: silvermind
mountFolder: maisi/maisi/silvermindWorkspace
portrait: "https://api.keepwork.com/ts-storage/siteFiles/47901/raw#1773589935415image.png"
searchPaths:
  # skills 统一存放在 skill-hub 仓库并发布到 CDN；baseUrlLocal 仅 localhost 生效，
  # 指向 vite dev 的 /skill-hub/ 中间件（伺服兄弟目录 skill-hub/），修改即生效。
  - prefix: "silvermind/skills"
    baseUrl: "https://cdn.keepwork.com/skill-hub/skills/"
    baseUrlLocal: "/skill-hub/skills/"
  - prefix: "silvermind/prompts"
    baseUrl: "silvermindWorkspace/prompts/"
historyLength: 20  
keepHistory: true
keepFullHistory: true
imageConfig:
  maxImageBytes: 32000
  autoConvertBase64ToURL: true
  maxImageHistoryCount: 2
summarizeAgent:
  config: "./config/silvermind_summarizeV2.yaml"
  silentTickInterval: 10
  maxRounds: 5
  maxTextLength: 8000
  # keepRecentRounds 字段当前是“已配置但未落实”的参数；它的预期语义是：摘要旧历史时，保留最近 3 组完整的 user + assistant 对话原文，较早内容压缩为摘要。
  keepRecentRounds: 3
  mode: "append"
skipHistoryServerLog: false
avatar_only: false
videoActions:
  idle:
    url: "https://cdn.keepwork.com/digitalhuman/v1/female/femalewaiter-new/idle_new.webp"
