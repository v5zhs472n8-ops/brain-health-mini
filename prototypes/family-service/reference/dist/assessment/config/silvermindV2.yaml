    url: "https://cdn.keepwork.com/digitalhuman/v1/female/femalewaiter-new/write.webp"
  查询|编程|用平板|coding:
    url: "https://cdn.keepwork.com/digitalhuman/v1/female/femalewaiter-new/pad.webp"
  点赞|喜欢|like:
    url: "https://cdn.keepwork.com/digitalhuman/v1/female/femalewaiter-new/like.webp"
