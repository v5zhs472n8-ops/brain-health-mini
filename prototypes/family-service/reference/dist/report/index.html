<style>body{margin:0;background:#eaf0ed;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}#preview-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;background:#fff;color:#354c44;font-size:14px;flex-wrap:wrap}#preview-controls select,#preview-controls button{font:inherit;border:1px solid #baccc4;border-radius:6px;padding:8px;background:#fff;color:#203d35}#app{height:100dvh}#preview-controls{position:fixed;bottom:8px;right:8px;z-index:100;opacity:.85;padding:6px 12px;font-size:12px;border-radius:6px}#preview-controls label{display:flex;align-items:center;gap:6px} @media(max-width:620px){#preview-controls > span{display:none}#preview-controls{max-width:calc(100vw - 16px);padding:4px 8px}#preview-controls select{max-width:190px}}#notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#203d35;color:#fff;padding:16px 24px;border-radius:8px;font-size:16px;z-index:100;max-width:90%;width:max-content}#notice[hidden]{display:none}</style><style>#preview-controls{display:none!important}</style>
