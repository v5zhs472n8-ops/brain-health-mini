<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:,">
<title>颜色陷阱 · 手机竖屏试玩候选 v0.1</title>
<style>
:root{
  --bg:#f4efe4;--card:#fffaf0;--line:#d6cbb6;--text:#403c32;--accent:#806329;
  --ok:#2f6b3a;--bad:#a62f25;--hint:#d99500;
  --sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);
  color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;line-height:1.45;
  touch-action:manipulation;-moz-user-select:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%}
button{font-family:inherit;color:inherit;touch-action:manipulation;-moz-user-select:none;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;cursor:pointer;margin:0}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;
  padding:var(--sat) var(--sar) var(--sab) var(--sal);overflow:hidden;background:var(--bg)}
[hidden]{display:none!important}

/* 顶栏 56px */
#topbar{flex:0 0 56px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 12px 0 8px;background:var(--card);border-bottom:2px solid var(--line)}
#btnPause{min-width:72px;height:48px;padding:0 12px;font-size:20px;font-weight:700;background:var(--card);
  border:2px solid var(--line);border-radius:12px;color:var(--accent)}
#btnPause:disabled{opacity:.45}
#hud{display:flex;align-items:center;font-size:clamp(18px,5vw,20px);font-weight:700;white-space:nowrap;
  font-variant-numeric:tabular-nums}
#hud span+span{margin-left:8px;padding-left:8px;border-left:2px solid var(--line)}
#hudLevel{color:var(--accent)}

/* 通用页 */
.screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px 20px;text-align:center;gap:clamp(12px,3dvh,24px)}
.panel{width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:clamp(16px,3dvh,28px) 18px}
h1{margin:0;font-size:clamp(34px,10vw,44px);color:var(--accent);letter-spacing:2px}
.lead{margin:12px 0 0;font-size:clamp(20px,5.6vw,24px);font-weight:700}
.sub{margin:10px 0 0;font-size:18px}
.bigbtn{width:100%;min-height:72px;font-size:clamp(24px,7vw,30px);font-weight:800;color:#fffaf0;background:var(--accent);
  border:0;border-radius:18px;box-shadow:0 4px 0 #5e481c}
.bigbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #5e481c}
.ghostbtn{width:100%;min-height:60px;font-size:22px;font-weight:700;background:var(--card);border:2px solid var(--line);
  border-radius:16px;color:var(--accent)}
.tag{font-size:18px;color:var(--bad);font-weight:700}

/* 倒计时 */
#countNum{font-size:clamp(120px,40vw,180px);font-weight:800;color:var(--accent);line-height:1}

/* 游戏区 */
#game{justify-content:space-between;padding:clamp(8px,1.6dvh,16px) 16px clamp(10px,2dvh,18px);gap:clamp(6px,1.2dvh,12px)}
.rule{margin:0;font-size:clamp(18px,5vw,22px);font-weight:700}
#stimulus{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:2px solid var(--line);border-radius:18px;
  font-size:clamp(56px,18vw,86px);font-weight:800;line-height:1.1;max-height:clamp(110px,26dvh,220px)}
#answers{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,3.4vw,16px)}
.answer{position:relative;width:100%;min-width:0;height:clamp(96px,15dvh,140px);min-height:96px;
  font-size:clamp(34px,10vw,44px);font-weight:700;color:#292929;background:var(--card);
  border:3px solid var(--line);border-radius:16px;box-shadow:0 3px 0 var(--line);padding:0}
#answers.n3 .answer:last-child{grid-column:1 / -1;justify-self:center;width:calc(50% - clamp(6px,1.7vw,8px))}
.answer:disabled{opacity:1}
.answer.wrong{border-color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.answer.right{border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.answer .mark{position:absolute;top:4px;right:10px;font-size:26px;line-height:1;font-weight:800}
.answer.wrong .mark{color:var(--bad)}
.answer.right .mark{color:var(--ok)}
.answer.hint{outline:6px solid var(--hint);outline-offset:0}
#status{width:100%;height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:center;margin:0;
  font-size:clamp(18px,5vw,20px);font-weight:700;border-radius:14px}
#status.fb{font-size:clamp(26px,7.5vw,32px);font-weight:800;background:var(--card);border:2px solid var(--line)}
#status.ok{color:var(--ok);border-color:var(--ok)}
#status.bad{color:var(--bad);border-color:var(--bad)}
#status.up{color:var(--accent);border-color:var(--accent)}
#btnHelp{flex:0 0 auto;min-width:60%;min-height:52px;padding:0 24px;font-size:20px;font-weight:700;background:var(--card);
  border:2px solid var(--line);border-radius:14px;color:var(--accent)}
#btnHelp:disabled{opacity:.45}

/* 结算 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.stat{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 6px}
.stat b{display:block;font-size:clamp(30px,9vw,38px);color:var(--accent);line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:18px}
.total b{font-size:clamp(56px,17vw,72px)}
.total{grid-column:1 / -1}

/* 暂停弹层 */
#pauseLayer{position:absolute;inset:0;z-index:10;background:rgba(64,60,50,.55);display:flex;align-items:center;
  justify-content:center;padding:24px}
#pauseLayer .panel{max-width:400px;display:flex;flex-direction:column;gap:16px}
#pauseLayer h2{margin:0;font-size:30px;color:var(--accent)}

/* 矮屏（横屏手机等）兜底：仍不出现滚动条 */
@media (max-height:560px){
  .rule{display:none}
  #stimulus{font-size:clamp(40px,12dvh,64px);max-height:22dvh}
  #status{height:44px;flex-basis:44px}
  #btnHelp{min-height:48px}
}
</style>
  <script type="module" crossorigin src="../../assets/colorTrap-BGJ8jGtg.js"></script>
  <link rel="modulepreload" crossorigin href="../../assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="../../assets/mobile-FVvosGoj.css">
</head>
<body>
<div id="app">
  <header id="topbar" hidden>
    <button id="btnPause" type="button" aria-label="暂停">暂停</button>
    <div id="hud" aria-live="off"><span id="hudTime">02:00</span><span id="hudLevel">基础</span><span id="hudScore">0分</span></div>
  </header>

  <main id="start" class="screen" hidden>
    <div class="panel">
      <h1>颜色陷阱</h1>
      <p class="lead">上面看颜色，下面读名字，<br>点出对应的颜色。</p>
      <p class="sub">例如：上面写着“蓝色”，字却是红的，就点“红色”。共 120 秒。</p>
      <p id="expTag" class="tag" hidden></p>
    </div>
    <button id="btnStart" class="bigbtn" type="button">开始训练</button>
  </main>

  <main id="count" class="screen" hidden>
    <p class="lead">准备开始</p>
    <div id="countNum" aria-live="assertive">3</div>
  </main>

  <main id="game" class="screen" hidden>
    <p class="rule">看上面字的实际颜色，点下面对应的名字</p>
    <div id="stimulus" aria-label="题干色词"></div>
    <div id="answers"></div>
    <p id="status" role="status"></p>
    <button id="btnHelp" type="button">需要提示</button>
  </main>

  <main id="end" class="screen" hidden>
    <div class="panel">
      <p class="lead" style="margin:0">时间到，本局结束</p>
      <div class="stats">
        <div class="stat total"><b id="rScore">0</b><span>总分</span></div>
        <div class="stat"><b id="rClears">0</b><span>正确数</span></div>
        <div class="stat"><b id="rErrors">0</b><span>失误数</span></div>
        <div class="stat" style="grid-column:1 / -1"><b id="rLevel">基础</b><span>到达等级</span></div>
      </div>
      <p id="endTag" class="tag" hidden></p>
    </div>
    <button id="btnAgain" class="bigbtn" type="button">继续训练</button>
  </main>

  <div id="pauseLayer" hidden role="dialog" aria-modal="true" aria-label="已暂停">
    <div class="panel">
      <h2>已暂停</h2>
      <p class="sub" style="margin:0">时间已经停住，不用着急。</p>
      <button id="btnResume" class="bigbtn" type="button">继续</button>
      <button id="btnRestart" class="ghostbtn" type="button">重新开始</button>
    </div>
  </div>
</div>
</body>
</html>
